# Include in EACH location defining add_header; nginx 1.27 does not merge it.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "interest-cohort=()" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Baseline embedding restrictions; third-party Matterport frames remain allowed.
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
