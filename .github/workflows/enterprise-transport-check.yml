name: Audit transport integrity snapshot
on:
  push:
    paths: ['.github/workflows/enterprise-transport-check.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: audit-transport-check
          path: .maintenance/enterprise-*.b64
          include-hidden-files: true
          retention-days: 1
