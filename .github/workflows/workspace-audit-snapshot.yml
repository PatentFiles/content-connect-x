name: Workspace audit source snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/workspace-audit-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD > /tmp/workspace-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-audit-source
          path: /tmp/workspace-source.tar
          retention-days: 1
