name: Restore original public branding (one-time)
on:
  push:
    branches: [fix/restore-public-homepage-branding]
    paths: [.github/workflows/restore-public-branding-once.yml]
permissions:
  contents: write
jobs:
  restore:
    if: github.repository == 'PatentFiles/content-connect-x' && github.ref == 'refs/heads/fix/restore-public-homepage-branding'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-public-homepage-branding
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore only public presentation and install appearance regressions
        run: node scripts/restore-public-branding-once.mjs
      - name: Commit source to the repair branch only (never main)
        run: |
          test "$(git branch --show-current)" = fix/restore-public-homepage-branding
          git diff --check
          git add src index.html scripts tests README.md docs .github/workflows/restore-public-branding-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Restore original public homepages and confine white styling to signed-in workspaces"
          git push origin HEAD:refs/heads/fix/restore-public-homepage-branding
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Original hero assets, responsive appearances and sign-in/sign-out
        env:
          STYLE_SCREENSHOT_DIR: artifacts/public-branding
        run: npm run test:ui-theme
      - run: npm run test:ui-controls
      - run: node scripts/test-identity-onboarding-browser.mjs
      - run: npm run verify:release
      - run: npm run verify:frontend-contract
      - run: npm run verify:edge-imports
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-homepage-restoration-screenshots
          path: artifacts/public-branding
          if-no-files-found: ignore
