name: Workspace and hosting update validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workspace-update.yml'
      - '.maintenance/apply-workspace-update.py'
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 .maintenance/apply-workspace-update.py
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Product and authorization regressions
        run: node --test $(find tests -name '*.test.mjs' ! -name 'hosting-authenticated.test.mjs' | sort)
      - run: node scripts/test-role-workspace-render.mjs
      - run: npm run verify:release
      - run: npm run verify:frontend-contract
      - run: npm run verify:edge-imports
      - run: npm run build
      - name: Commit verified application changes
        run: |
          git config user.name 'Content Connect maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src supabase tests docs
          git rm -f .maintenance/workspace-delta-*.b64 .maintenance/apply-workspace-update.py
          git commit -m "Repair live role metrics, separate member pages, add host settings, fullscreen maps, tours and shared amenities"
          git push origin HEAD:main
