name: UI style audit source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ui-style-audit-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source
        run: git archive --format=tar HEAD > /tmp/ui-style-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: ui-style-source
          path: /tmp/ui-style-source.tar
          retention-days: 1
