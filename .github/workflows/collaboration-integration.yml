name: Collaboration and representation integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261119181000_collaboration_plans_archive_and_invitation_cooldown.sql'
      - 'supabase/migrations/20261119182000_mutual_professional_representation_agreements.sql'
      - 'supabase/functions/collaboration-workspace/**'
      - 'supabase/functions/member-workflows/**'
      - 'src/supabase/CollaborationHub.jsx'
      - 'src/supabase/RepresentationAgreements.jsx'
      - 'src/supabase/MemberSettings.jsx'
      - 'scripts/test-collaboration-database.sql'
      - '.github/workflows/collaboration-integration.yml'
  push:
    branches: [feat/collaboration-archive-representation-and-settings-20261119]
permissions:
  contents: read
concurrency:
  group: ccx-collab-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: ccx_collab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: ccx_collab_test
      PGUSER: postgres
      PGPASSWORD: disposable-only
    steps:
      - uses: actions/checkout@v4
      - name: Test migrations and server-enforced invariants in disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f scripts/test-collaboration-database.sql
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint and type-check
        run: |
          npm run lint
          npm run typecheck
      - name: Validate import graph
        run: npm run verify:edge-imports
      - name: Build app
        run: npm run build
