name: Access policy source snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/access-policy-snapshot.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > /tmp/access-policy-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: access-policy-source
          path: /tmp/access-policy-source.tar
          retention-days: 1
