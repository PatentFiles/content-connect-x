name: Identity worker container
on:
  pull_request:
    paths: ['server/idv-worker/**', '.github/workflows/identity-worker-build.yml']
  push:
    branches: [fix/identity-guidance-results-diagnostics]
    paths: ['server/idv-worker/**', '.github/workflows/identity-worker-build.yml']
permissions:
  contents: read
concurrency:
  group: identity-worker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build exact worker and guarded pinned-engine patches
        run: docker build -t ccx-idv-tested server/idv-worker
      - name: Start non-privileged worker and verify startup contract
        run: |
          set -euo pipefail
          docker run -d --name ccx-idv-check -p 18080:8080 -e PORT=8080 -e SUPABASE_URL=https://aaaaaaaaaaaaaaaaaaaa.supabase.co ccx-idv-tested
          trap 'docker logs ccx-idv-check; docker rm -f ccx-idv-check >/dev/null 2>&1 || true' EXIT
          ready=false
          for attempt in $(seq 1 120); do
            test "$(docker inspect --format '{{.State.Running}}' ccx-idv-check)" = true || exit 1
            if curl --silent --fail --max-time 3 http://127.0.0.1:18080/health >/tmp/idv-health.json; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';const h=JSON.parse(fs.readFileSync('/tmp/idv-health.json'));assert.equal(h.worker_revision,'ccx-guided-capture-2026-11-19-v3');assert.equal(h.ocr_self_test,true);assert.ok(h.modes.includes('pilot'));console.log('PASS actual worker OCR startup, model loading and patched revision');"
          code=$(curl --silent --max-time 5 -o /tmp/idv-denied -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:18080/process)
          test "$code" = 400
          echo 'PASS malformed work request rejected; no real evidence or account was used'
