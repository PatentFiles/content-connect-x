name: Mobile identity checked-JavaScript validation
on:
  push:
    branches: [fix/identity-mobile-camera-progress]
    paths:
      - scripts/type-identity-mobile-once.mjs
      - .github/workflows/mobile-identity-typecheck-once.yml
permissions:
  contents: write
jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/identity-mobile-camera-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/type-identity-mobile-once.mjs
      - name: Commit checked contracts on the repair branch only
        run: |
          test "$(git branch --show-current)" = fix/identity-mobile-camera-progress
          git diff --check
          git add src/supabase/LiveIdentityCamera.jsx src/supabase/IdentityVerification.jsx src/supabase/identityApi.js src/supabase/identityCamera.mjs src/supabase/identityTransfer.mjs scripts/type-identity-mobile-once.mjs .github/workflows/mobile-identity-typecheck-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Type camera lifecycle, progress events and cancellation contracts"
          git push origin HEAD:refs/heads/fix/identity-mobile-camera-progress
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: node scripts/test-identity-onboarding-browser.mjs
      - run: npm run test:ui-theme
      - run: npm run test:ui-controls
      - run: npm run verify:release
      - run: npm run verify:frontend-contract
      - run: npm run verify:edge-imports
      - run: npm run build
