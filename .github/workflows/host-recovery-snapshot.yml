name: Host source recovery snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/host-recovery-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Package tracked source and dependencies without credentials
        run: |
          git archive --format=tar HEAD > /tmp/host-source.tar
          tar -czf /tmp/host-dependencies.tgz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: host-recovery-source
          path: |
            /tmp/host-source.tar
            /tmp/host-dependencies.tgz
          retention-days: 1
