name: Enterprise audit repair validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/enterprise-audit-update.yml', '.maintenance/apply-enterprise-audit.py']
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply checked source changes
        run: python3 .maintenance/apply-enterprise-audit.py
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:ui-controls
      - run: node scripts/test-role-workspace-render.mjs
      - run: npm run verify:release
      - run: npm run verify:frontend-contract
      - run: npm run verify:edge-imports
      - run: npm run build
      - name: Verify container health and actual security headers
        run: |
          docker build --build-arg VITE_SUPABASE_URL=https://example.supabase.co --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_fixture_123456789 -t ccx-audit:ci .
          docker run -d --name ccx-audit-ci -p 18080:8080 ccx-audit:ci
          trap 'docker logs ccx-audit-ci || true; docker rm -f ccx-audit-ci || true' EXIT
          curl --fail --retry 12 --retry-delay 2 --retry-all-errors http://127.0.0.1:18080/healthz
          for path in / /index.html /sw-hosting.js /healthz; do
            curl --fail -sD /tmp/ccx-headers -o /dev/null "http://127.0.0.1:18080$path"
            grep -qi 'X-Content-Type-Options: nosniff' /tmp/ccx-headers
            grep -qi 'X-Frame-Options: DENY' /tmp/ccx-headers
            grep -qi 'Content-Security-Policy:.*frame-ancestors' /tmp/ccx-headers
          done
      - name: Commit validated application source
        run: |
          git config user.name 'Content Connect maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dockerfile README.md package.json vite.config.js deploy src supabase tests scripts docs
          git rm -f .maintenance/enterprise-*.b64 .maintenance/apply-enterprise-audit.py
          git commit -m "Repair enterprise audit security, transactional workflows, calendar and notification reliability; document remaining blockers"
          git push origin HEAD:main
