name: Identity result race repair
on:
  push:
    branches: [fix/identity-guidance-results-diagnostics]
    paths: [.github/workflows/identity-result-regression-once.yml, scripts/identity-result-regression-once.mjs]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/identity-guidance-results-diagnostics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/identity-result-regression-once.mjs
      - name: Commit regression updates to repair branch only
        run: |
          test "$(git branch --show-current)" = fix/identity-guidance-results-diagnostics
          git diff --check
          git add src/supabase/IdentityVerification.jsx scripts/test-identity-onboarding-browser.mjs scripts/identity-result-regression-once.mjs .github/workflows/identity-result-regression-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prove automatic private-test results survive pending-response races'
          git push origin HEAD:refs/heads/fix/identity-guidance-results-diagnostics
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: node scripts/test-identity-onboarding-browser.mjs
      - run: npm run build
