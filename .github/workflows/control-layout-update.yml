name: Verify responsive sidebar control spacing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/control-layout-update.yml']
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Bind sidebar width and verify layout without a browser cleanup race
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/supabase/OriginalShell.jsx');s=p.read_text()
          old='<aside className="fixed bottom-0 left-0 hidden w-64 flex-col border-r md:flex"'
          assert s.count(old)==1
          s=s.replace(old,'<aside className="ccx-shell-sidebar fixed bottom-0 left-0 hidden w-64 flex-col border-r md:flex"');p.write_text(s)
          p=Path('scripts/test-control-layout-browser.mjs');s=p.read_text()
          old="   if(main.getBoundingClientRect().top<hr.bottom-.5)failures.push('header overlaps content');"
          assert s.count(old)==1
          new=old+"\n   const sidebar=document.querySelector('.ccx-shell-sidebar');\n   if(sidebar&&sidebar.getBoundingClientRect().width>0){\n    const sr=sidebar.getBoundingClientRect();\n    if(sr.top<hr.bottom-.5)failures.push('header overlaps sidebar');\n    if(main.getBoundingClientRect().left<sr.right-.5)failures.push('sidebar overlaps page content');\n   }"
          s=s.replace(old,new)
          old=" socket?.close();browser?.kill();\n // Chrome may still hold files briefly after Browser.close().\n await new Promise(resolve=>setTimeout(resolve,100));\n fs.rmSync(folder,{recursive:true,force:true,maxRetries:5,retryDelay:100});"
          new=""" socket?.close();
           // Chrome's child processes may finish profile writes after Browser.close().
           // Wait for process exit and retry asynchronously, never blocking its exit event.
           if(browser&&browser.exitCode===null)await new Promise(resolve=>{
            const timer=setTimeout(()=>{browser.kill('SIGKILL');resolve();},5000);
            browser.once('exit',()=>{clearTimeout(timer);resolve();});browser.kill();
           });
           try{await fs.promises.rm(folder,{recursive:true,force:true,maxRetries:12,retryDelay:200});}
           catch(error){
            // A locked throwaway profile is not a failed geometry assertion. Keep all
            // assertion/runtime failures fatal, and report cleanup-only OS contention.
            if(!['ENOTEMPTY','EBUSY'].includes(error.code))throw error;
            console.warn('Browser checks completed; temporary profile cleanup deferred:',error.code);
           }"""
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:control-layout
      - run: npm run test:ui-controls
      - run: npm run build
      - name: Commit tested responsive sidebar correction
        run: |
          git config user.name 'Content Connect maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/supabase/OriginalShell.jsx scripts/test-control-layout-browser.mjs
          git commit -m "Keep sidebar and content separated and make browser regression cleanup reliable"
          git push origin HEAD:main
