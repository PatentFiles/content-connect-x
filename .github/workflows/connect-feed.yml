name: Connect Feed and Groups privacy integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/*connect_feed*'
      - 'supabase/migrations/*connect_groups*'
      - 'supabase/migrations/*feed_member_display_preferences*'
      - 'supabase/migrations/*feed_verified_self_photo*'
      - 'supabase/functions/media-gateway/**'
      - 'scripts/test-feed-verified-self-photo.sql'
      - 'supabase/functions/connect-feed/**'
      - 'supabase/functions/connect-groups/**'
      - 'supabase/functions/platform-extras/**'
      - 'src/supabase/ConnectFeed.jsx'
      - 'src/supabase/ConnectGroups.jsx'
      - 'src/supabase/CustomDashboard.jsx'
      - 'src/supabase/SupabaseApp.jsx'
      - 'src/supabase/OriginalShell.jsx'
      - 'src/supabase/roleNavigationData.mjs'
      - 'scripts/test-connect-feed-database.sql'
      - 'scripts/test-connect-groups-database.sql'
      - 'tests/connect-feed.test.mjs'
      - 'tests/feed-display-preferences.test.mjs'
      - 'scripts/test-feed-display-preferences.sql'
      - 'src/supabase/FeedPreferencesSettings.jsx'
      - 'src/supabase/feedDisplayPreferences.mjs'
      - 'src/supabase/MemberSettings.jsx'
      - 'tests/connect-groups.test.mjs'
      - 'tests/connect-feed-permalink.test.mjs'
      - 'src/supabase/CreatorDiscovery.jsx'
      - 'src/supabase/SponsorshipSlot.jsx'
      - 'ops/AD_NETWORK_ONBOARDING.md'
      - '.github/workflows/connect-feed.yml'
  push:
    branches: [feat/compact-feed-preferences-mobile-hero-20261119]
permissions:
  contents: read
concurrency:
  group: connect-feed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ccx_feed_test
          POSTGRES_PASSWORD: fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ccx_feed_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: ccx_feed_test
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - name: Run real Feed and Groups SQL against disposable PostgreSQL
        run: |
          test "$PGDATABASE" = ccx_feed_test
          psql --no-psqlrc -v ON_ERROR_STOP=1 -f scripts/test-connect-feed-database.sql
          psql --no-psqlrc -v ON_ERROR_STOP=1 -c "alter table public.account_security add column admin boolean not null default false"
          psql --no-psqlrc -v ON_ERROR_STOP=1 -f supabase/migrations/20261119235900_connect_groups_private_public.sql
          psql --no-psqlrc -v ON_ERROR_STOP=1 -f supabase/migrations/20261120003000_connect_feed_post_permalink.sql
          psql --no-psqlrc -v ON_ERROR_STOP=1 -f supabase/migrations/20261120014500_feed_verified_self_photo.sql
          psql --no-psqlrc -v ON_ERROR_STOP=1 -f scripts/test-connect-groups-database.sql
          psql --no-psqlrc -v ON_ERROR_STOP=1 -f scripts/test-feed-verified-self-photo.sql
          psql --no-psqlrc -v ON_ERROR_STOP=1 -f supabase/migrations/20261120035500_feed_member_display_preferences.sql
          psql --no-psqlrc -v ON_ERROR_STOP=1 -f scripts/test-feed-display-preferences.sql
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Feed and Groups auth, privacy, moderation and dashboard tests
        run: node --test tests/connect-feed.test.mjs tests/connect-groups.test.mjs tests/connect-feed-permalink.test.mjs tests/feed-display-preferences.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
