name: Trust and personal dashboard validation
on:
  pull_request:
  push:
    branches: [feat/trust-footer-personal-dashboard]
permissions:
  contents: read
concurrency:
  group: trust-dashboard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/dashboard-and-access.test.mjs tests/trust-intake.test.mjs
      - name: Actual dashboard and trust screens, isolated from live accounts
        run: node --experimental-websocket scripts/test-trust-dashboard-browser.mjs
        env:
          STYLE_SCREENSHOT_DIR: trust-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trust-dashboard-synthetic-screenshots
          path: trust-screenshots
          if-no-files-found: ignore
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: trust_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: trust_test
      PGUSER: postgres
      PGPASSWORD: isolated-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Minimal auth adapter in isolated PostgreSQL; no production credentials
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE SCHEMA ccx_workspace_private;
          GRANT USAGE ON SCHEMA auth,ccx_workspace_private TO authenticated,service_role;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE TABLE public.account_security(user_id uuid PRIMARY KEY REFERENCES auth.users(id),admin boolean NOT NULL DEFAULT false,banned boolean NOT NULL DEFAULT false,suspended boolean NOT NULL DEFAULT false);
          CREATE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $$ SELECT coalesce(nullif(current_setting('request.jwt.claims',true),''),'{}')::jsonb; $$;
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT (auth.jwt()->>'sub')::uuid; $$;
          SQL
      - name: Apply the exact trust migration and exercise database permissions
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261119141902_trust_request_intake_disabled_until_operator_review.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-trust-database.sql
