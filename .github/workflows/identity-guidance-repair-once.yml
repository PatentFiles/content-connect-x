name: Identity guidance repair validation
on:
  push:
    branches: [fix/identity-guidance-results-diagnostics]
    paths: [.github/workflows/identity-guidance-repair-once.yml, scripts/identity-guidance-repair-once.mjs]
permissions:
  contents: write
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/identity-guidance-results-diagnostics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded source repair
        run: node scripts/identity-guidance-repair-once.mjs
      - name: Commit only to the existing repair branch
        run: |
          test "$(git branch --show-current)" = fix/identity-guidance-results-diagnostics
          git diff --check
          git add src server/idv-worker supabase/functions/identity-pilot scripts/test-identity-onboarding-browser.mjs README.md docs/IDENTITY_GUIDANCE_RESULTS.md scripts/identity-guidance-repair-once.mjs .github/workflows/identity-guidance-repair-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Guide live captures, synchronize final results and repair strict document adapters'
          git push origin HEAD:refs/heads/fix/identity-guidance-results-diagnostics
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Real component countdown, camera and identity result scenarios
        run: node scripts/test-identity-onboarding-browser.mjs
      - name: Preserve original public artwork and white signed-in workspaces
        run: npm run test:ui-theme
      - run: npm run test:ui-controls
      - run: npm run verify:release
      - run: npm run verify:frontend-contract
      - run: npm run verify:edge-imports
      - run: npm run build
