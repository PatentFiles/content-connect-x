name: Content Connect X quality gate
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ccx-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Type-check entire application
        run: npm run typecheck
      - name: Hosting policy and geospatial tests
        run: npm run test:hosting
      - name: Yoti integration trust boundaries
        run: npm run test:integrations
      - name: Modular feature registry tests
        run: npm run test:modules
      - name: Mobile keyboard selection tests
        run: node --test tests/mobile-form-keyboards.test.mjs
      - name: Adult onboarding and membership policy tests
        run: npm run test:memberships
      - name: Onboarding profile and database schema contract
        run: node --test tests/onboarding-schema-contract.test.mjs
      - name: Private profile analytics protections
        run: npm run test:analytics
      - name: Bolt preview and Supabase public configuration tests
        run: npm run test:bolt-config
      - name: Directory public-filter policy tests
        run: npm run test:directory
      - name: Release integration configuration tests
        run: npm run test:readiness
      - name: Release invariants
        run: npm run verify:release
      - name: Frontend and Supabase gateway contract
        run: npm run verify:frontend-contract
      - name: All Edge Functions must have resolved local imports
        run: npm run verify:edge-imports
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Build Supabase application
        run: npm run build
      - name: Build staging container and verify health endpoint
        run: |
          docker build --build-arg VITE_SUPABASE_URL=https://example.supabase.co \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_fixture_123456789 \
            -t content-connect-x:ci .
          docker run -d --name ccx-ci -p 18080:8080 content-connect-x:ci
          trap 'docker logs ccx-ci || true; docker rm -f ccx-ci || true' EXIT
          sleep 3
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:18080/healthz
          curl --fail --retry 5 --retry-delay 1 --retry-all-errors http://127.0.0.1:18080/ | grep -q '<html'
      - name: Verify protected Edge Function gateway
        run: npm run smoke:supabase
