name: Content Connect X quality gate
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ccx-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Type-check entire application
        run: npm run typecheck
      - name: Hosting policy and geospatial tests
        run: npm run test:hosting
      - name: Release invariants
        run: npm run verify:release
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Build Supabase application
        run: npm run build
      - name: Build staging container and verify health endpoint
        run: |
          docker build -t content-connect-x:ci .
          docker run -d --name ccx-ci -p 18080:8080 content-connect-x:ci
          trap 'docker rm -f ccx-ci || true' EXIT
          curl --fail --retry 12 --retry-delay 2 --retry-connrefused http://127.0.0.1:18080/healthz
          curl --fail http://127.0.0.1:18080/ | grep -q '<html'
      - name: Verify protected Edge Function gateway
        run: npm run smoke:supabase
