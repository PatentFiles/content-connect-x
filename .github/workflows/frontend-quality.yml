name: Content Connect X quality gate
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ccx-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (previously resolved revision)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (previously resolved revision)
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Type-check entire application
        run: npm run typecheck
      - name: All offline policy, authorization and product regressions
        run: npm run test:unit
      - name: Enterprise administration diagnostics wiring
        run: node --test tests/enterprise-diagnostics-wiring.test.mjs
      - name: Inventory all interactive JSX controls and fail on inert elements
        run: npm run audit:ui-controls
      - name: Upload interactive control inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (previously resolved revision)
        with:
          name: ccx-interactive-controls
          path: artifacts/interactive-controls.json
          if-no-files-found: ignore
      - name: Desktop, mobile and enlarged-text control geometry
        run: npm run test:ui-controls
      - name: Professional light theme across public pages, host dialogs and all role dashboards
        run: npm run test:ui-theme
      - name: First-party identity onboarding browser regression
        run: node scripts/test-identity-onboarding-browser.mjs
      - name: Open every footer link in isolated Chromium and check trust forms
        run: node --experimental-websocket scripts/test-trust-dashboard-browser.mjs
      - name: Click Feed and Reposts tabs and actions on mobile and desktop
        run: node --experimental-websocket scripts/test-feed-reposts-browser.mjs
      - name: Click every role sidebar and mobile navigation destination in isolated Chromium
        run: node --experimental-websocket scripts/test-all-role-navigation-browser.mjs
      - name: Render actual role workspaces and shared cards
        run: node scripts/test-role-workspace-render.mjs
      - name: Release invariants
        run: npm run verify:release
      - name: Frontend and Supabase gateway contract
        run: npm run verify:frontend-contract
      - name: All Edge Functions must have resolved local imports
        run: npm run verify:edge-imports
      - name: Check all literal Edge database table and field contracts
        run: npm run audit:db-contract
      - name: Upload backend schema contract inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (previously resolved revision)
        with:
          name: ccx-backend-schema-contract
          path: artifacts/backend-schema-contract.json
          if-no-files-found: ignore
      - name: Build Supabase application
        run: npm run build
      - name: Build staging container and verify health and security headers
        run: |
          docker build --build-arg VITE_SUPABASE_URL=https://example.supabase.co \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_fixture_123456789 \
            -t content-connect-x:ci .
          docker run -d --name ccx-ci -p 18080:8080 content-connect-x:ci
          trap 'docker logs ccx-ci || true; docker rm -f ccx-ci || true' EXIT
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:18080/healthz
          curl --fail --retry 5 --retry-delay 1 --retry-all-errors http://127.0.0.1:18080/ | grep -q '<html'
          for path in / /index.html /sw-hosting.js /healthz; do
            curl --fail -sD /tmp/ccx-headers -o /dev/null "http://127.0.0.1:18080$path"
            grep -qi 'X-Content-Type-Options: nosniff' /tmp/ccx-headers
            grep -qi 'X-Frame-Options: DENY' /tmp/ccx-headers
            grep -qi 'Content-Security-Policy:.*frame-ancestors' /tmp/ccx-headers
          done
      - name: Verify protected API and calendar scheduler boundaries
        run: npm run smoke:supabase
      - name: Provider endpoints reject anonymous or unsigned requests
        run: |
          # Retry bounded transport timeouts, never accept a timeout, 404 or 2xx.
          for fn in identity-verification ccx-law-portal annual-recap ccx-operations membership-billing membership-ccbill-webhook hosting-ccbill-webhook; do
            payload='{}'
            if [ "$fn" = identity-verification ]; then payload='{"action":"status"}'; fi
            code=$(curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 --retry-max-time 65 --connect-timeout 10 --max-time 20 -o /tmp/provider-response -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "$payload" "https://yxuqbygykpfbioslljlf.supabase.co/functions/v1/$fn")
            if [ "$fn" = identity-verification ]; then
              case "$code" in 401|403) echo "$fn rejects unauthenticated status ($code)" ;; *) echo "$fn returned unexpected status $code"; exit 1 ;; esac
            else
              case "$code" in 400|401|403|503) echo "$fn rejects unsigned request ($code)" ;; *) echo "$fn returned unexpected status $code"; exit 1 ;; esac
            fi
          done
  # Full registry audit; no advisory exclusions or continue-on-error.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (previously resolved revision)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (previously resolved revision)
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=low
