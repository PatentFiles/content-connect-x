name: Host Connect refresh validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/host-connect-refresh.yml'
      - '.maintenance/host-connect-refresh.py'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply hash-verified recovered changes
        run: python3 .maintenance/host-connect-refresh.py
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:hosting
      - run: npm run test:integrations
      - run: npm run test:readiness
      - run: npm run verify:release
      - run: npm run verify:frontend-contract
      - run: npm run verify:edge-imports
      - name: Host and private-gallery regressions
        run: node --test tests/host-refresh.test.mjs tests/hosting-discovery-runtime.test.mjs
      - run: npm run build
      - name: Commit validated source and remove temporary recovery files
        run: |
          git config user.name 'Host Connect maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src supabase docs tests scripts .github/workflows/frontend-quality.yml
          git rm -f .maintenance/host-refresh-data-0.b64 .maintenance/host-refresh-data-1.b64 .maintenance/host-refresh-data-2.b64 .maintenance/host-connect-refresh.py .github/workflows/host-connect-refresh.yml .github/workflows/host-recovery-snapshot.yml
          git commit -m "Complete Host Connect modals, carousels, market map, photo galleries and secrets cleanup"
          git push origin HEAD:main
