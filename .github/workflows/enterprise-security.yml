name: Enterprise security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enterprise-security-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-scanning:
    name: Detect committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (previously resolved revision)
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2 (previously resolved revision)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  security-analysis:
    name: OWASP static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (previously resolved revision)
      - name: Install Semgrep scanner
        run: python -m pip install --disable-pip-version-check 'semgrep>=1.100,<2'
      - name: Scan source against OWASP rules
        run: |
          mkdir -p artifacts
          set +e
          semgrep scan --config p/owasp-top-ten --config p/javascript --error --json --output artifacts/semgrep.json .
          scan_result=$?
          set -e
          python - <<'PY'
          import json, pathlib
          file=pathlib.Path('artifacts/semgrep.json')
          if not file.exists():
              print('Semgrep report unavailable; scanner result remains authoritative.')
          else:
              report=json.loads(file.read_text())
              findings=report.get('results',[])
              print(f"Semgrep recorded {len(findings)} findings:")
              for finding in findings[:60]:
                  print(f"{finding.get('extra',{}).get('severity','UNKNOWN')} | {finding.get('check_id','unknown')} | {finding.get('path','unknown')}:{finding.get('start',{}).get('line','?')}")
          PY
          exit "$scan_result"
      - name: Preserve scan report for incident review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (previously resolved revision)
        with:
          name: enterprise-semgrep-report
          path: artifacts/semgrep.json
          if-no-files-found: ignore
  dependency-audit:
    name: Audit shipped packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (previously resolved revision)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (previously resolved revision)
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check production dependencies
        run: |
          mkdir -p artifacts
          npm audit --omit=dev --audit-level=high --json > artifacts/npm-audit.json || exit_code=$?
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('artifacts/npm-audit.json')); console.log(JSON.stringify(j.metadata?.vulnerabilities||{})); if((j.metadata?.vulnerabilities?.high||0)+(j.metadata?.vulnerabilities?.critical||0)>0)process.exit(1)"
      - name: Save dependency report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (previously resolved revision)
        with:
          name: enterprise-dependency-audit
          path: artifacts/npm-audit.json
          if-no-files-found: ignore
