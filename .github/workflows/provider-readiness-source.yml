name: Provider readiness source snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/provider-readiness-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: git archive --format=tar HEAD > /tmp/provider-source.tar
      - run: npm ci
      - name: Record audit without suppressing release checks
        run: |
          npm audit --json > /tmp/provider-audit.json || test -s /tmp/provider-audit.json
          npm ls picomatch --all > /tmp/provider-glob-tree.txt
          tar -czf /tmp/provider-dependencies.tgz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: provider-readiness-source
          path: |
            /tmp/provider-source.tar
            /tmp/provider-audit.json
            /tmp/provider-glob-tree.txt
            /tmp/provider-dependencies.tgz
          retention-days: 1
