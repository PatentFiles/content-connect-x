name: Generate pinned secure map dependency lock
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-map-lock.yml'
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Resolve patched MapLibre package without running dependency scripts
        run: |
          cp package-lock.json "$RUNNER_TEMP/old-lock.json"
          npm install --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund maplibre-gl@6.19.0
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/old-lock.json','utf8'));
          const after=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const changed=Object.fromEntries(Object.entries(after.packages).filter(([k,v])=>JSON.stringify(before.packages[k])!==JSON.stringify(v)));
          const removed=Object.keys(before.packages).filter(k=>!(k in after.packages));
          const metadata=Object.fromEntries(Object.entries(after).filter(([k])=>k!=='packages'));
          const delta=Buffer.from(JSON.stringify({metadata,changed,removed})).toString('base64');
          const chunks=delta.match(/.{1,1800}/g)||[];
          chunks.forEach((chunk,i)=>console.log('MAPLOCK '+(i+1)+'/'+chunks.length+' '+chunk));
          JS
      - name: Audit resolved package graph
        run: npm audit --audit-level=low
      - name: Find residual retired role references in active source
        if: always()
        run: |
          git grep -inE 'spa_provider|chef_services|spa_treatments|chef_pro|(^|[^[:alpha:]])chef([^[:alpha:]]|$)|spa / wellness|spa treatments|catering' -- src supabase/functions public scripts tests ops README.md || true
