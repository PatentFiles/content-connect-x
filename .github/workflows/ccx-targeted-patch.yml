name: Apply reviewed dashboard integration patches
on:
  push:
    branches: [fix/dashboard-workflow-parity-20261117]
    paths: [.github/workflows/ccx-targeted-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-workflow-parity-20261117
      - name: Apply exact reviewed replacements
        shell: python
        run: |
          from pathlib import Path
          def replace(path, before, after, count=1):
              p=Path(path); source=p.read_text()
              if source.count(before)!=count:
                  raise RuntimeError(f'Unexpected source in {path}: {source.count(before)} matches')
              p.write_text(source.replace(before,after))
          replace('src/supabase/HostingMarketplace.jsx','Camera, Home, Film, ArrowLeft','Camera, Home, ArrowLeft')
          replace('src/supabase/moduleAccessPolicy.mjs','Object.hasOwn(ACCESS_COPY,decision.reason)','Object.prototype.hasOwnProperty.call(ACCESS_COPY,decision.reason)')
          replace('.github/workflows/frontend-quality.yml', '      - name: Mobile keyboard selection tests\n', '      - name: Dashboard customization and access contract\n        run: node --test tests/dashboard-and-access.test.mjs\n      - name: Mobile keyboard selection tests\n')
          replace('src/supabase/SupabaseApp.jsx', '  const approved = isAdmin || (verification?.status', '  // Shell administration is separate from independently verified workflow access.\n  const approved = isAdmin || (verification?.status')
          # Refresh stored age/account data after a manual verification reload.
          anchor="  const authenticate = async (event) => {"
          listener="  useEffect(()=>{\n    const update=()=>{if(session?.user)void refresh(session).catch(e=>setError(e.message));};\n    window.addEventListener('ccx-verification-refreshed',update);\n    return()=>window.removeEventListener('ccx-verification-refreshed',update);\n  },[session?.access_token,refresh]);\n\n"
          replace('src/supabase/SupabaseApp.jsx',anchor,listener+anchor)
          # A route that opens security must survive refresh and browser navigation.
          replace('src/supabase/OriginalShell.jsx', "Notifications:'notifications',AvailabilitySchedule:'schedule',TravelSchedule:'schedule',AdminDashboard:'controls'", "Notifications:'notifications',AccountSecurity:'account-security',Consent:'consent',ProductionManager:'production',AvailabilitySchedule:'schedule',TravelSchedule:'schedule',AdminDashboard:'controls'")
          replace('src/supabase/OriginalShell.jsx', "notifications:'Notifications',schedule:'AvailabilitySchedule',representations:'Roster'", "notifications:'Notifications','account-security':'AccountSecurity',consent:'Consent',production:'ProductionManager',schedule:'AvailabilitySchedule',representations:'Roster'")
          Path('.github/workflows/ccx-targeted-patch.yml').unlink()
      - name: Commit reviewed changes to the working branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/supabase/HostingMarketplace.jsx src/supabase/moduleAccessPolicy.mjs src/supabase/SupabaseApp.jsx src/supabase/OriginalShell.jsx .github/workflows/frontend-quality.yml .github/workflows/ccx-targeted-patch.yml
          git diff --cached --stat
          git commit -m 'Apply targeted integration fixes without changing page layouts'
          git push origin HEAD:fix/dashboard-workflow-parity-20261117
