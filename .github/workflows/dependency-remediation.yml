name: Validate dependency remediation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-remediation.yml'
      - '.maintenance/repair-build-matcher.py'
permissions:
  contents: write
jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 .maintenance/repair-build-matcher.py
      - name: Resolve and clean install the audited replacement
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Full registry security audit (no exceptions)
        run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:ui-controls
      - run: node scripts/test-role-workspace-render.mjs
      - run: npm run verify:release
      - run: npm run build
      - name: Commit only verified dependency changes
        run: |
          git config user.name 'Content Connect maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor package.json package-lock.json
          git rm .maintenance/repair-build-matcher.py
          git commit -m "Resolve picomatch advisory with source-reviewed bounded build matcher; clean full audit"
          git push origin HEAD:main
      - name: Preserve evidence
        if: always()
        run: |
          npm audit --json > /tmp/dependency-audit.json || test -s /tmp/dependency-audit.json
          git archive --format=tar HEAD > /tmp/dependency-source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-remediation-evidence
          path: |
            /tmp/dependency-audit.json
            /tmp/dependency-source.tar
          retention-days: 1
