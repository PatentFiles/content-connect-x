name: Isolated migration reproducibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/replay/**'
      - 'supabase/sql/**'
      - '.github/workflows/isolated-migration-replay.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/replay/**'
      - 'supabase/sql/**'
      - '.github/workflows/isolated-migration-replay.yml'
permissions:
  contents: read
concurrency:
  group: isolated-migration-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Official Docker Hub image namespace; ECR anonymous pulls hit a quota.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      PGHOST: 127.0.0.1
      PGPORT: '54322'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: postgres # disposable local Supabase default, not a hosted credential
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install checksum-pinned Supabase CLI
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --max-time 120 https://github.com/supabase/cli/releases/download/v2.79.0/supabase_linux_amd64.tar.gz -o "$RUNNER_TEMP/supabase-cli.tgz"
          echo "624dc29c696345dcc4fbe5293925c10c163f99f2952adeaeae892200740a3a27  $RUNNER_TEMP/supabase-cli.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/supabase-cli.tgz" -C "$RUNNER_TEMP" supabase
          "$RUNNER_TEMP/supabase" --version
      - name: Boot a new unlinked, disposable local database
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD
          mkdir -p "$RUNNER_TEMP/supabase-replay"
          cd "$RUNNER_TEMP/supabase-replay"
          "$RUNNER_TEMP/supabase" init
          "$RUNNER_TEMP/supabase" start -x studio,logflare,vector,supavisor,edge-runtime,imgproxy,realtime
          test "$(psql -XAt -v ON_ERROR_STOP=1 -c 'select inet_server_port()')" = 5432
          # First isolate the local database from initiating network connections.
          db="$(docker ps --filter name=supabase_db_ --format '{{.ID}}')"
          test "$(printf '%s\n' "$db" | wc -l)" = 1
          test -n "$db"
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$db")"
          [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sudo iptables -I DOCKER-USER 1 -s "$ip" -m conntrack --ctstate NEW -j REJECT
          # Supabase's local postgres login is not a superuser. Use the
          # container's local administrative role, never a hosted credential.
          if test "$(psql -XAt -v ON_ERROR_STOP=1 -c "select count(*) from pg_settings where name='cron.launch_active_jobs'")" = 1; then
            docker exec -e PGPASSWORD=postgres "$db" psql -U supabase_admin -d postgres -X -v ON_ERROR_STOP=1 -c "alter system set cron.launch_active_jobs = 'off'"
            docker exec -e PGPASSWORD=postgres "$db" psql -U supabase_admin -d postgres -X -v ON_ERROR_STOP=1 -c 'select pg_reload_conf()'
            for attempt in 1 2 3 4 5; do
              if test "$(psql -XAt -v ON_ERROR_STOP=1 -c 'show cron.launch_active_jobs')" = off; then break; fi
              sleep 1
            done
            test "$(psql -XAt -v ON_ERROR_STOP=1 -c 'show cron.launch_active_jobs')" = off
          fi
      - name: Replay every committed migration with no production credentials
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/supabase-replay"
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/
          # Legacy baseline migrations 046-053 live under supabase/sql, not
          # supabase/migrations. The original live ledger order was verified
          # against their SQL definitions. Stage copies ONLY in this temporary
          # local project: never insert synthetic version IDs into production.
          # Restore four intervening, reviewed ledger-only hosting migrations.
          cp "$GITHUB_WORKSPACE/supabase/replay/20261115144149_hosting_reschedule_and_financial_evidence_triggers.sql" "supabase/migrations/20261117013826_hosting_reschedule_and_financial_evidence_triggers.sql"
          cp "$GITHUB_WORKSPACE/supabase/replay/20261115144622_hosting_trusted_signer_names_and_docusign_reconciliation.sql" "supabase/migrations/20261117013827_hosting_trusted_signer_names_and_docusign_reconciliation.sql"
          cp "$GITHUB_WORKSPACE/supabase/replay/20261115144917_hosting_ccbill_checkout_attempt_guards.sql" "supabase/migrations/20261117013828_hosting_ccbill_checkout_attempt_guards.sql"
          cp "$GITHUB_WORKSPACE/supabase/replay/20261115145050_hosting_delivery_worker_and_payout_uniqueness.sql" "supabase/migrations/20261117013829_hosting_delivery_worker_and_payout_uniqueness.sql"
          # Live ledger: 20261115160636
          cp "$GITHUB_WORKSPACE/supabase/sql/046_enterprise_hotpath_indexes.sql" "supabase/migrations/20261117015001_046_enterprise_hotpath_indexes.sql"
          # Live ledger: 20261115173650
          cp "$GITHUB_WORKSPACE/supabase/sql/047_onlyhost_multibrand_vault_identity_pass.sql" "supabase/migrations/20261117015002_047_onlyhost_multibrand_vault_identity_pass.sql"
          # Live ledger: 20261115174220
          cp "$GITHUB_WORKSPACE/supabase/sql/048_onlyhost_origins_and_private_testing_documents.sql" "supabase/migrations/20261117015003_048_onlyhost_origins_and_private_testing_documents.sql"
          # Live ledger: 20261115174839
          cp "$GITHUB_WORKSPACE/supabase/sql/049_onlyhost_shared_reservations.sql" "supabase/migrations/20261117015004_049_onlyhost_shared_reservations.sql"
          # Live ledger: 20261115180610
          cp "$GITHUB_WORKSPACE/supabase/sql/050_yoti_branded_return_origins.sql" "supabase/migrations/20261117015005_050_yoti_branded_return_origins.sql"
          # Live ledger: 20261117015736
          cp "$GITHUB_WORKSPACE/supabase/sql/051_creator_profiles_favorites_and_dungeon.sql" "supabase/migrations/20261117015736_051_creator_profiles_favorites_and_dungeon.sql"
          # Live ledger: 20261117021725
          cp "$GITHUB_WORKSPACE/supabase/sql/052_restore_original_host_role.sql" "supabase/migrations/20261117021725_052_restore_original_host_role.sql"
          # Live ledger: 20261117022457
          cp "$GITHUB_WORKSPACE/supabase/sql/053_original_creator_production_preferences.sql" "supabase/migrations/20261117022457_053_original_creator_production_preferences.sql"
          # The identity CI fixtures already reference these canonical SQL files.
          cp "$GITHUB_WORKSPACE/supabase/sql/identity_admin_pilot.sql" "supabase/migrations/20261118220731_identity_admin_pilot.sql"
          "$RUNNER_TEMP/supabase" migration up --local
          expected="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"
          actual="$(psql -XAt -v ON_ERROR_STOP=1 -c 'select count(*) from supabase_migrations.schema_migrations')"
          test "$expected" = "$actual"
          echo "Fresh local migration replay: $actual/$expected"
      - name: Verify private storage and table RLS
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF EXISTS(SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND NOT c.relrowsecurity)
            THEN RAISE EXCEPTION 'Public table lacks RLS'; END IF;
            IF EXISTS(SELECT 1 FROM storage.buckets WHERE public) THEN RAISE EXCEPTION 'Public storage bucket'; END IF;
          END $$;
          SQL
      - name: Run actual rollback-only application fixtures
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/tests/sql/enterprise-integrity.sql"
          psql -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/scripts/check-provider-membership.sql"
      - name: Tear down isolated database
        if: always()
        run: |
          cd "$RUNNER_TEMP/supabase-replay" 2>/dev/null || exit 0
          "$RUNNER_TEMP/supabase" stop --no-backup || true
